[package]
name = "gitadel-issues"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
gitadel-db.workspace = true
gitadel-identity.workspace = true
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
futures-util.workspace = true
sea-orm.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true
gitadel-core = { workspace = true, features = ["markdown"] }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
gitadel-db = { workspace = true, features = ["test-support"] }
