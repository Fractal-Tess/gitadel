[package]
name = "gitadel-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Gitadel HTTP API and service integration"
build = "build.rs"

[lib]
path = "src/lib.rs"

[features]
# Produces only an offline contract exporter; it cannot start a service.
api-contract-export = []

[dependencies]
gitadel-config.workspace = true
gitadel-core = { workspace = true, features = ["markdown"] }
gitadel-git.workspace = true
gitadel-issues.workspace = true
gitadel-registry.workspace = true
gitadel-db.workspace = true
gitadel-secrets.workspace = true
gitadel-mail.workspace = true
gitadel-storage.workspace = true
gitadel-backups.workspace = true
gitadel-integrations.workspace = true
gitadel-actions.workspace = true
gitadel-identity.workspace = true
gitadel-instance.workspace = true
gitadel-repositories = { workspace = true, features = ["openapi"] }
anyhow.workspace = true
async-trait.workspace = true
argon2.workspace = true
axum.workspace = true
axum-extra.workspace = true
base64.workspace = true
bytes.workspace = true
config.workspace = true
chrono.workspace = true
hex.workspace = true
image.workspace = true
lettre.workspace = true
libc.workspace = true
resvg.workspace = true
mime_guess.workspace = true
rand.workspace = true
prost.workspace = true
pbjson.workspace = true
pbjson-types.workspace = true
reqwest.workspace = true
russh.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
yaml_serde.workspace = true
shlex.workspace = true
sley.workspace = true
sley-gc.workspace = true
sley-core.workspace = true
sley-config.workspace = true
sley-diff-merge.workspace = true
sley-rev.workspace = true
sha2.workspace = true
subtle.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tokio-util.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
url = { workspace = true, features = ["serde"] }
uuid.workspace = true
webauthn-rs.workspace = true
futures-util.workspace = true
walkdir.workspace = true
axum-server.workspace = true
rustls.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true

[build-dependencies]
sha2-build.workspace = true
pbjson-build.workspace = true
prost-build.workspace = true
protoc-bin-vendored.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true
gitadel-secrets = { workspace = true, features = ["test-support"] }
gitadel-db = { workspace = true, features = ["test-support"] }
gitadel-mail = { workspace = true, features = ["test-support"] }
