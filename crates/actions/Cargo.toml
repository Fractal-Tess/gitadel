[package]
name = "gitadel-actions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Actions workflow planning, runner operations, and run persistence"

[lib]
path = "src/lib.rs"

[dependencies]
gitadel-config.workspace = true
gitadel-core.workspace = true
gitadel-git.workspace = true
sley.workspace = true
anyhow.workspace = true
gitadel-identity.workspace = true
gitadel-secrets.workspace = true
gitadel-db.workspace = true
base64.workspace = true
bytes.workspace = true
futures-util.workspace = true
chrono.workspace = true
cron.workspace = true
globset.workspace = true
hex.workspace = true
quick-xml.workspace = true
rand.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "sync"] }
tracing.workspace = true
uuid.workspace = true
yaml_serde.workspace = true

[dev-dependencies]
gitadel-secrets = { workspace = true, features = ["test-support"] }
gitadel-db = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
