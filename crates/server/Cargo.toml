[package]
name = "gitadel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A self-hosted Git service."

[[bin]]
name = "gitadel"
path = "src/main.rs"

[features]
api-contract-export = ["gitadel-api/api-contract-export"]

[dependencies]
gitadel-api.workspace = true
gitadel-config.workspace = true
gitadel-db.workspace = true
gitadel-storage.workspace = true
gitadel-registry.workspace = true
gitadel-core.workspace = true
gitadel-identity.workspace = true
gitadel-instance.workspace = true
gitadel-repositories.workspace = true
gitadel-actions.workspace = true
gitadel-backups.workspace = true
gitadel-integrations.workspace = true
gitadel-mail.workspace = true
gitadel-secrets.workspace = true
anyhow.workspace = true
axum-server.workspace = true
sea-orm.workspace = true
tokio-util.workspace = true
rustls.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
