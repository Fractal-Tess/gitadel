[actions]
# Jobs reach Gitadel over the Compose network, so server, clone, API, and
# artifact URLs handed to them use the service name instead of the public URL.
internal_url = "http://gitadel:3000"
# Allow commit-pinned actions such as actions/checkout from the default origin.
allowed_action_origins = ["https://code.forgejo.org"]

[actions.system_runner]
name = "gitadel-system"
labels = ["docker"]
registration_token_file = "/runner/registration-token"
