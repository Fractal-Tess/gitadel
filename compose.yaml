# Gitadel as a single service. This file is all you need:
#
#   docker compose up -d
#   docker compose logs gitadel    # open the one-time setup link it prints
#
# Set GITADEL_PUBLIC_URL to the address people open in a browser, and
# GITADEL_LISTEN_ADDRESS=0.0.0.0 to accept connections from other hosts.
# compose.actions.yaml is the same stack with a built-in Actions runner.
services:
  gitadel:
    image: ghcr.io/fractal-tess/gitadel:${GITADEL_VERSION:-latest}
    restart: unless-stopped
    environment:
      GITADEL_PUBLIC_URL: ${GITADEL_PUBLIC_URL:-http://localhost:3000}
    ports:
      - "${GITADEL_LISTEN_ADDRESS:-127.0.0.1}:${GITADEL_HTTP_PORT:-3000}:3000"
      - "${GITADEL_LISTEN_ADDRESS:-127.0.0.1}:${GITADEL_SSH_PORT:-2222}:2222"
    volumes:
      - gitadel-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  gitadel-data:
