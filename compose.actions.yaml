services:
  gitadel:
    depends_on:
      runner-data-init:
        condition: service_completed_successfully
    environment:
      GITADEL_PUBLIC_URL: ${GITADEL_PUBLIC_URL:?Set GITADEL_PUBLIC_URL when using the Actions overlay}
      GITADEL_CONFIG: /etc/gitadel.toml
    volumes:
      - runner-data:/runner
      - ./deploy/forgejo-runner/gitadel.toml:/etc/gitadel.toml:ro

  runner-data-init:
    image: alpine:3.24
    user: "0:0"
    volumes:
      - runner-data:/runner
    command: ["sh", "-c", "chown -R 10001:10001 /runner && chmod 700 /runner"]
    restart: "no"

  runner-docker:
    image: docker.io/library/docker@sha256:3f3c01aaaebf7cce837356b688b7c059a4749f10bd7660dec7c58fc454a283f0
    privileged: true
    command: ["dockerd", "-H", "tcp://0.0.0.0:2375", "--tls=false"]
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - runner-docker:/var/lib/docker
    restart: unless-stopped

  runner:
    image: data.forgejo.org/forgejo/runner@sha256:ca3d5eea46004789a175d1369eec6829d3ea9bfbe2011a06625b4bdaa55f7552
    user: "10001:10001"
    depends_on:
      gitadel:
        condition: service_healthy
      runner-docker:
        condition: service_started
    environment:
      DOCKER_HOST: tcp://runner-docker:2375
      GITADEL_RUNNER_INSTANCE_URL: ${GITADEL_PUBLIC_URL:?Set GITADEL_PUBLIC_URL when using the Actions overlay}
    volumes:
      - runner-data:/data
      - ./deploy/forgejo-runner/config.yml:/data/config.yml:ro
    entrypoint: ["/usr/bin/dumb-init", "--", "/bin/sh", "-ec"]
    command:
      - |
        if [ ! -s /data/.runner ]; then
          until [ -s /data/registration-token ]; do sleep 1; done
          forgejo-runner register --no-interactive \
            --instance "$${GITADEL_RUNNER_INSTANCE_URL}" \
            --token "$$(cat /data/registration-token)" \
            --name gitadel-system \
            --labels docker
          rm -f /data/registration-token
        fi
        exec forgejo-runner daemon --config /data/config.yml
    restart: unless-stopped

volumes:
  runner-data:
  runner-docker:
