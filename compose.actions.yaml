# Gitadel with a built-in Forgejo Actions runner. This file is self-contained:
#
#   docker compose -f compose.actions.yaml up -d
#   docker compose -f compose.actions.yaml logs gitadel   # one-time setup link
#
# The runner registers itself; workflows use `runs-on: docker`. The Docker
# daemon that runs jobs is privileged, so run only workflows you trust.
services:
  gitadel:
    image: ghcr.io/fractal-tess/gitadel:${GITADEL_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      runner-data-init:
        condition: service_completed_successfully
    environment:
      GITADEL_PUBLIC_URL: ${GITADEL_PUBLIC_URL:-http://localhost:3000}
      GITADEL_CONFIG: /etc/gitadel.toml
    ports:
      - "${GITADEL_LISTEN_ADDRESS:-127.0.0.1}:${GITADEL_HTTP_PORT:-3000}:3000"
      - "${GITADEL_LISTEN_ADDRESS:-127.0.0.1}:${GITADEL_SSH_PORT:-2222}:2222"
    volumes:
      - gitadel-data:/data
      - runner-data:/runner
    configs:
      - source: gitadel
        target: /etc/gitadel.toml
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Gitadel writes a one-time registration token into this shared volume.
  runner-data-init:
    image: alpine:3.24
    user: "0:0"
    volumes:
      - runner-data:/runner
    command: ["sh", "-c", "chown -R 10001:10001 /runner && chmod 700 /runner"]
    restart: "no"

  runner-docker:
    image: docker.io/library/docker@sha256:3f3c01aaaebf7cce837356b688b7c059a4749f10bd7660dec7c58fc454a283f0
    privileged: true
    command: ["dockerd", "-H", "tcp://0.0.0.0:2375", "--tls=false"]
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - runner-docker:/var/lib/docker
    restart: unless-stopped

  runner:
    # v13.0.0, matching REQUIRED_RUNNER_VERSION.
    image: data.forgejo.org/forgejo/runner@sha256:7fb853bfe73c229be6349398359c0a7bd01fadfd17c106607b2221150b799ed2
    user: "10001:10001"
    depends_on:
      gitadel:
        condition: service_healthy
      runner-docker:
        condition: service_started
    environment:
      DOCKER_HOST: tcp://runner-docker:2375
    volumes:
      - runner-data:/data
    configs:
      - source: runner
        target: /etc/forgejo-runner/config.yml
    entrypoint: ["/usr/bin/dumb-init", "--", "/bin/sh", "-ec"]
    command:
      - |
        cd /data
        if [ ! -s /data/.runner ]; then
          until [ -s /data/registration-token ]; do sleep 1; done
          forgejo-runner register --no-interactive \
            --instance http://gitadel:3000 \
            --token "$$(cat /data/registration-token)" \
            --name gitadel-system \
            --labels docker
          rm -f /data/registration-token
        fi
        exec forgejo-runner daemon --config /etc/forgejo-runner/config.yml
    restart: unless-stopped

configs:
  gitadel:
    content: |
      [actions]
      # The runner and its jobs reach Gitadel over the Compose network, so
      # server, clone, API, and artifact URLs handed to jobs use this address.
      internal_url = "http://gitadel:3000"
      # Allow commit-pinned actions such as actions/checkout.
      allowed_action_origins = ["https://code.forgejo.org"]

      [actions.system_runner]
      name = "gitadel-system"
      labels = ["docker"]
      registration_token_file = "/runner/registration-token"

  runner:
    content: |
      log:
        level: info
        job_level: info
      runner:
        file: /data/.runner
        capacity: 1
        timeout: 3h
        shutdown_timeout: 3h
        fetch_timeout: 30s
        fetch_interval: 2s
        report_interval: 1s
        labels:
          docker:
            backend: docker
            backend-options:
              image: docker.io/library/node@sha256:8a34c4ab3ea2c5cd194f07e317b2a8f09461d3c8b05c4e34c8ccd56d56024c4d
      cache:
        # Serves actions/cache; jobs reach the runner by its service name.
        enabled: true
        dir: /data/cache
        host: runner
      container:
        # Share the Docker daemon's network namespace so jobs resolve Compose
        # service names such as gitadel.
        network: host
        privileged: false
        valid_volumes: []
        docker_host: "-"
        force_pull: true

volumes:
  gitadel-data:
  runner-data:
  runner-docker:
