name: SvelteKit CI
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "bun.lock"
      - "svelte.config.js"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".forgejo/workflows/ci.yml"

jobs:
  validate:
    runs-on: docker
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
    steps:
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Clone pushed commit
        env:
          CHECKOUT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git -c http.extraheader="Authorization: Bearer ${CHECKOUT_TOKEN}" clone --no-checkout "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" source
          cd source
          git checkout --detach "${GITHUB_SHA}"
      - name: Install locked dependencies
        run: bun install --cwd source --frozen-lockfile
      - name: Check Svelte project
        run: bun run --cwd source check
      - name: Build SvelteKit project
        run: bun run --cwd source build
      - name: Publish checked commit
        id: metadata
        run: echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Upload production build
        uses: forgejo/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sveltekit-build
          path: source/build
          retention-days: 1

  report:
    needs: validate
    runs-on: docker
    steps:
      - name: Verify dependency output
        run: test "${{ needs.validate.outputs.commit }}" = "${GITHUB_SHA}"
      - name: Download production build
        uses: forgejo/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sveltekit-build
          path: downloaded
      - name: Verify downloaded build
        run: test -f downloaded/index.js
