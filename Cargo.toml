[package]
name = "gitadel"
version = "0.3.0"
edition = "2024"
rust-version = "1.97.1"
description = "A self-hosted Git service."
license = "MIT"
build = "build.rs"

[[bin]]
name = "gitadel"
path = "src/main.rs"

[dependencies]
ammonia = "4.1.4"
anyhow = "1.0.100"
async-trait = "0.1.89"
argon2 = "0.5.3"
axum = "0.8.8"
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.22.1"
bytes = "1.12.1"
clap = { version = "4.5.53", features = ["derive", "env"] }
config = { version = "0.15.18", default-features = false, features = ["toml"] }
comrak = { version = "0.54.0", default-features = false }
chrono = { version = "0.4.42", features = ["serde"] }
http-body-util = "0.1.3"
hmac = "0.12.1"
mime_guess = "2.0.5"
rand = "0.9.2"
openssl = { version = "0.10.81", features = ["vendored"] }
png = "0.18.0"
rust-embed = "8.7.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rand_10 = { package = "rand", version = "0.10.2" }
russh = { version = "0.62.7", default-features = false, features = ["ring", "rsa"] }
sea-orm = { version = "2.0.2", default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite", "with-chrono", "with-uuid"] }
sea-orm-migration = { version = "2.0.2", default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite", "with-chrono", "with-uuid"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
shlex = "2.0.1"
sley = { version = "0.5.2", default-features = false, features = ["fast-sha1", "mmap"] }
sha2 = "0.10.9"
ssh-key = "0.6.7"
time = "0.3.44"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tower-http = { version = "0.6.6", features = ["trace"] }
tokei = { version = "14.0.0", default-features = false }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.19.0", features = ["serde", "v4"] }
webauthn-rs = { version = "0.5.5", default-features = false }
fs2 = "0.4.3"
tar = "0.4.46"
walkdir = "2.5.0"
zstd = "0.13.3"

